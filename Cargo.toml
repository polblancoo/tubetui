[package]
name = "tubetui"
version = "0.8.1"
edition = "2024"
rust-version = "1.88"
description = "YouTube and your local videos and music in the terminal: tabs, video embedded in kitty via mpv, subscriptions, playlists, history with resume, downloads, SponsorBlock, chapters, comments and browser login"
license = "MIT OR Apache-2.0"
repository = "https://github.com/polblancoo/tubetui"
homepage = "https://polblancoo.github.io/tubetui/"
readme = "README.md"
keywords = ["youtube", "tui", "ratatui", "mpv", "terminal"]
categories = ["command-line-utilities", "multimedia::video"]
exclude = ["/.github", "/ConfigSeed.toml", "/docs", "/packaging"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1_smol = "1.0.1"
tachyonfx = "0.25"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
trash = "5.2.9"
ureq = "3.4.2"

# `cargo deb`: the Debian / Ubuntu package attached to each release.
[package.metadata.deb]
maintainer = "polblancoo <polblancoo@gmail.com>"
section = "video"
depends = "$auto, mpv"
recommends = "yt-dlp"
suggests = "kitty, xdotool, x11-utils, wmctrl"
extended-description = """\
tubetui browses YouTube from the terminal: your home feed, subscriptions, \
watch later, playlists, history, downloads, search, channels and comments, \
plus your local videos and music. SponsorBlock skips sponsors. Videos play \
with mpv, embedded in kitty, in a window or as an overlay. YouTube changes \
often: keep yt-dlp current (pipx install yt-dlp) rather than the distro one."""
assets = [
    ["target/release/tubetui", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/tubetui/README.md", "644"],
    ["packaging/linux/tubetui.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/tubetui-kitty.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/tubetui.svg", "usr/share/icons/hicolor/scalable/apps/tubetui.svg", "644"],
    ["packaging/linux/tubetui-48.png", "usr/share/icons/hicolor/48x48/apps/tubetui.png", "644"],
    ["packaging/linux/tubetui-128.png", "usr/share/icons/hicolor/128x128/apps/tubetui.png", "644"],
    ["packaging/linux/tubetui-256.png", "usr/share/icons/hicolor/256x256/apps/tubetui.png", "644"],
]
